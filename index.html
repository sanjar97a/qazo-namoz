<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1220" />
  <title>Namoz va Qazo</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root {
      --bg: #0B1220; --card: #131C2E; --card2: #1A2540; --line: #24314F;
      --text: #E6ECF7; --sub: #8FA0BF; --blue: #4C8DF6; --orange: #F5A524; --green: #2FBF71; --red: #EF5B5B;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #app { max-width: 520px; margin: 0 auto; padding: 20px 16px 60px; }
    h1 { font-size: 28px; margin: 0; }
    .sub { color: var(--sub); font-size: 14px; }
    .hint { color: var(--sub); font-size: 12px; line-height: 1.45; margin: 8px 0 0; }
    .section { color: var(--blue); font-size: 18px; font-weight: 700; margin: 24px 0 8px; }
    .row { display: flex; align-items: center; gap: 12px; }
    .grow { flex: 1; }
    button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--text);
      border-radius: 14px; padding: 13px; font-weight: 600; }
    button:disabled { cursor: default; }
    .btn { width: 100%; margin-top: 10px; }
    .primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .danger { color: var(--red); border-color: var(--red); }
    .icon { width: 48px; height: 48px; padding: 0; font-size: 22px; color: var(--blue); }
    .prayer { display: flex; align-items: center; background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 14px; margin-bottom: 8px; }
    .prayer.live { border-color: var(--blue); }
    .pname { font-size: 17px; font-weight: 600; }
    .mark { min-width: 112px; padding: 8px 12px; border-radius: 12px; background: transparent; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-top: 24px; }
    .card h2 { color: var(--blue); font-size: 18px; margin: 0 0 14px; }
    .stat { flex: 1; text-align: center; }
    .big { font-size: 34px; font-weight: 800; }
    .divider { width: 1px; height: 50px; background: var(--line); }
    .finish { color: var(--blue); background: var(--card2); border-radius: 12px; padding: 12px; margin-top: 14px; text-align: center; font-size: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .q { background: var(--card2); border: 1px solid var(--line); border-radius: 20px; padding: 16px; text-align: center; }
    .q b { color: var(--blue); font-size: 18px; }
    .q .num { font-size: 26px; font-weight: 700; margin: 10px 0; }
    .q button { width: 52px; height: 44px; padding: 0; font-size: 24px; margin: 0 4px; background: transparent; }
    label { display: block; color: var(--sub); font-size: 12px; margin: 12px 0 4px; }
    input[type=text], input[type=number], input[type=date], input[type=time], select, textarea { width: 100%; background: var(--card); color: var(--text); border: 1px solid var(--line);
      border-radius: 12px; padding: 12px; font: inherit; }
    input[type=date] { color-scheme: dark; min-height: 46px; }
    textarea { height: 90px; resize: vertical; }
    input[type=time], select { color-scheme: dark; min-height: 46px; }
    .note { position: relative; background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 34px 12px 14px;
      margin-top: 16px; font-size: 13px; line-height: 1.5; color: var(--sub); }
    .note b { color: var(--text); }
    .note .x { position: absolute; top: 4px; right: 4px; border: 0; background: none; padding: 6px 10px; color: var(--sub); font-size: 18px; }
    .install { background: var(--green); border-color: var(--green); color: #fff; margin-top: 16px; }
    .loc { background: var(--card); border: 1px solid var(--green); border-radius: 12px; padding: 12px; margin-top: 10px; line-height: 1.5; }
    .warn { color: var(--orange); }
    .results { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .result { text-align: left; font-weight: 500; padding: 11px 12px; }
    .times { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .trow { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 14px; }
    .trow input[type=time] { width: 150px; flex: none; }
    .off { color: var(--orange); font-size: 12px; }
    .mini { padding: 6px 10px; font-size: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chip { border-radius: 20px; padding: 8px 14px; font-weight: 500; }
    .chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
    .switch { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
    .switch input { width: 22px; height: 22px; accent-color: var(--blue); }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--card2); border: 1px solid var(--blue);
      padding: 12px 18px; border-radius: 14px; max-width: 90%; white-space: pre-line; z-index: 9; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
